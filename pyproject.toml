[project]
name = "softdesk-support-api"
version = "0.1.0"
description = "API RESTful de suivi de problemes pour SoftDesk Support"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "django>=5.2.18,<5.3",
    "djangorestframework>=3.16,<3.17",
    "djangorestframework-simplejwt>=5.5,<6.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
